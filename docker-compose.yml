services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  localstack:
    # Fixei a versão do LocalStack para 3.8, pois versões mais recentes exigem um token de autenticação, e a ideia é que o projeto rode executado com `docker compose up` e nada mais.
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    # O healthcheck é feito somente depois que o script de inicialização das filas for executado, garantindo que as filas estejam disponíveis para os serviços dependentes.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true' && curl -fs http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build: .
    env_file: .env
    # Live source mount + `bun --watch` gives hot reload; the anonymous volume keeps the
    # image's node_modules (Linux build) instead of the host folder.
    command: ["bun", "--watch", "src/main.ts"]
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres-data:
